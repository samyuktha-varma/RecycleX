<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Recycling Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #e8f5e9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background-color: #ffffff;
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 128, 0, 0.25);
      width: 550px;
      max-width: 90%;
      text-align: center;
    }

    h2 {
      color: #2e7d32;
      margin-bottom: 20px;
    }

    form input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1.1rem;
      box-sizing: border-box;
    }

    form button {
      width: 100%;
      padding: 14px;
      background-color: #4caf50;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    form button:hover {
      background-color: #388e3c;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .link {
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .link a {
      color: #1976d2;
      text-decoration: none;
    }

    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <p id="message"></p>
    <div class="link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      // 1. Fetch any users registered in this browser session
      const users = JSON.parse(localStorage.getItem("registeredUsers") || "[]");
      
      // 2. Check if credentials match a registered user or a default tester account
      const user = users.find(u => u.email === email && u.password === password);
      const isDefaultTester = (email === "test@gmail.com" && password === "test1234");

      if (user || isDefaultTester) {
        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";
        localStorage.setItem("loggedInUser", email);
        
        // Redirect to your dashboard page
        setTimeout(() => { 
          window.location.href = "dashboard.html"; 
        }, 1000);
      } else {
        message.style.color = "red";
        message.textContent = "Invalid credentials. Please register first!";
      }
    });
  </script>
</body>
</html>
