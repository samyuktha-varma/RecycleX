<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Recycling Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <p id="message"></p>
    <p style="margin-top: 15px; text-align: center;">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      // Fetch users registered in this browser session
      const users = JSON.parse(localStorage.getItem("registeredUsers") || "[]");
      
      // Check credentials against local records or universal tester profile
      const user = users.find(u => u.email === email && u.password === password);
      const isDefaultTester = (email === "test@gmail.com" && password === "test1234");

      if (user || isDefaultTester) {
        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";
        localStorage.setItem("loggedInUser", email);
        
        setTimeout(() => { 
          window.location.href = "dashboard.html"; 
        }, 1000);
      } else {
        message.style.color = "red";
        message.textContent = "Invalid credentials. Please register first!";
      }
    });
  </script>
</body>
</html>
